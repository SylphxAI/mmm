name: CI

on:
  # No merge_group — Merge Queue off by default (Fast Trunk).
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: Build & Test
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4

      - name: Verify static owned runner profiles
        run: bash scripts/check-owned-runner-profiles.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Test packages
        run: bun run test

      - name: Residual Biome check (informational)
        continue-on-error: true
        run: bun run lint
