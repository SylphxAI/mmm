name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product:
    name: Build & Test
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4

      - name: Verify static owned runner profiles
        run: bash scripts/check-owned-runner-profiles.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Test packages
        run: bun run test

      - name: Residual Biome check (informational)
        continue-on-error: true
        run: bun run lint
